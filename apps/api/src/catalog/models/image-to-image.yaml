  - id: microsoft/mai-image-2.5-pro/edit
    name: MAI Image 2.5 Pro Edit
    provider: microsoft
    description: >
      Highest MAI single-image edit. Prefer when the source lighting should stay cinematic. One source image. Flat per-edit price, higher than generate.
    promptingTechnics:
      - Keep edit prompts narrow and surgical by specifying one change per run (e.g., split a background swap and a headline update into separate passes).
      - Always end with an explicit preservation clause (e.g., "Keep the subject identity, pose, label text, and drop shadow exactly as they are").
      - Describe how added or modified objects match the existing scene lighting direction, perspective, and shadows.
      - Quote any updated in-image text verbatim and specify its placement and typography.
    selectionGuidance:
      - Shines at single-image surgical edits—such as localized object swaps, background cleanup, portrait relighting, and short headline localization—where realistic shadows and perspective must blend seamlessly.
      - Avoid when you need to combine multiple reference images in one call (supports only a single input image; use GPT Image 2.5 Edit or Nano Banana Edit for multi-reference workflows).
      - Flat per-edit resource footprint with higher visual fidelity and shadow coherence than standard MAI Image 2.5 Edit, at the trade-off of slightly longer processing time.
    contextWindow: ~
    pricing:
      unit: per_inference
      rate: 0.29
    categories: [image-to-image]
    parameters:
      - { id: parameter_prompt, required: true }
      - { id: parameter_image, required: true }
      - {
          id: parameter_aspect_ratio,
          required: false,
          defaultValue: 1:1,
          allowedValues: [1:1, 4:3, 3:4, 16:9, 9:16, 3:2, 2:3],
        }
      - {
          id: parameter_output_format,
          required: false,
          defaultValue: png,
          allowedValues: [jpeg, png, webp],
        }

  - id: microsoft/mai-image-2.5/edit
    name: MAI Image 2.5 Edit
    provider: microsoft
    description: >
      Cheaper MAI single-image edit. Prefer for volume retouches. Aspect ratio size=auto keeps the source frame.
    promptingTechnics:
      - Name the single element to modify and the exact change instead of bundling multiple edits in one instruction.
      - State explicitly what must remain untouched (facial identity, outfit silhouette, layout structure, and lighting).
      - Match added objects to the source lighting and perspective, and quote any replacement text verbatim.
    selectionGuidance:
      - Shines at fast, everyday single-image cleanup (removing background distractions, swapping a prop, or tweaking colors) while automatically preserving the source aspect ratio.
      - Avoid for multi-reference compositing or high-stakes hero retouching requiring deep cinematic lighting reconstruction.
      - Very low latency and a lightweight, flat resource footprint make it ideal for batch retouching and iterative single-variable edits.
    contextWindow: ~
    pricing:
      unit: per_inference
      rate: 0.05
    categories: [image-to-image]
    parameters:
      - { id: parameter_prompt, required: true }
      - { id: parameter_image, required: true }
      - {
          id: parameter_aspect_ratio,
          required: false,
          defaultValue: auto,
          allowedValues: [auto, 1:1, 4:3, 3:4, 16:9, 9:16, 3:2, 2:3],
        }
      - {
          id: parameter_output_format,
          required: false,
          defaultValue: png,
          allowedValues: [jpeg, png, webp],
        }
