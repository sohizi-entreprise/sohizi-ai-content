      - { id: parameter_output_format, required: false, defaultValue: png, allowedValues: [png, jpeg, webp] }

  - id: google/nano-banana-pro/edit
    name: Nano Banana Pro Edit
    provider: google
    description: >
      Top Nano Banana edit. Prefer for style transfer and local changes when GPT Image fidelity is unnecessary. Up to 14 source images. Same resolution prices as generate.
    contextWindow: ~
    pricing:
      unit: parameter_table
      rate:
        - { when: { resolution: 1k }, usd: 0.14 }
        - { when: { resolution: 2k }, usd: 0.14 }
        - { when: { resolution: 4k }, usd: 0.24 }
    categories: [image-to-image]
    parameters:
      - { id: parameter_prompt, required: true }
      - { id: parameter_images, required: true, constraints: { min: 1 } }
      - { id: parameter_aspect_ratio, required: false, defaultValue: 1:1, allowedValues: [1:1, 3:2, 2:3, 3:4, 4:3, 4:5, 5:4, 9:16, 16:9, 21:9] }
