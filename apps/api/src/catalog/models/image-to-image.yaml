# Matching edit endpoints for the image families.
models:
  - id: openai/gpt-image-2/edit
    name: GPT Image 2 Edit
    provider: openai
    description: >
      Instruction-driven GPT Image 2 edit. Prefer for object add/remove, background swap, and in-image text fixes. Accepts up to 16 source images. Edit costs slightly more than the matching generate cell.
    contextWindow: ~
    pricing:
      unit: parameter_table
      rate:
        - { when: { quality: low, resolution: 1k }, usd: 0.02 }
        - { when: { quality: low, resolution: 2k }, usd: 0.03 }
        - { when: { quality: low, resolution: 4k }, usd: 0.04 }
        - { when: { quality: medium, resolution: 1k }, usd: 0.07 }
        - { when: { quality: medium, resolution: 2k }, usd: 0.11 }
        - { when: { quality: medium, resolution: 4k }, usd: 0.19 }
        - { when: { quality: high, resolution: 1k }, usd: 0.23 }
        - { when: { quality: high, resolution: 2k }, usd: 0.41 }
        - { when: { quality: high, resolution: 4k }, usd: 0.73 }
    categories: [image-to-image]
    parameters:
      - { id: parameter_prompt, required: true }
      - { id: parameter_images, required: true, constraints: { min: 1 } }
      - { id: parameter_aspect_ratio, required: false, defaultValue: 1:1, allowedValues: [1:1, 1:2, 2:1, 1:3, 3:1, 2:3, 3:2, 3:4, 4:3, 4:5, 5:4, 9:16, 16:9, 9:21, 21:9] }
      - { id: parameter_resolution, required: true, defaultValue: 1k, allowedValues: [1k, 2k, 4k] }
      - { id: parameter_quality, required: true, defaultValue: medium, allowedValues: [low, medium, high] }
      - { id: parameter_output_format, required: false, defaultValue: png, allowedValues: [png, jpeg, webp] }

  - id: openai/gpt-image-2.5-flare/edit
    name: GPT Image 2.5 Flare Edit
    provider: openai
    description: >
      Faster GPT Image 2.5 edit. Prefer for iterative retouching. Use xhigh/max only when identity or typography must stay exact. Up to 16 source images.
    contextWindow: ~
    pricing:
      unit: parameter_table
      rate:
        - { when: { quality: low, resolution: 1k }, usd: 0.025 }
        - { when: { quality: low, resolution: 2k }, usd: 0.035 }
        - { when: { quality: low, resolution: 4k }, usd: 0.045 }
        - { when: { quality: medium, resolution: 1k }, usd: 0.039 }
        - { when: { quality: medium, resolution: 2k }, usd: 0.055 }
        - { when: { quality: medium, resolution: 4k }, usd: 0.085 }
        - { when: { quality: high, resolution: 1k }, usd: 0.105 }
        - { when: { quality: high, resolution: 2k }, usd: 0.165 }
        - { when: { quality: high, resolution: 4k }, usd: 0.285 }
        - { when: { quality: xhigh, resolution: 1k }, usd: 0.175 }
        - { when: { quality: xhigh, resolution: 2k }, usd: 0.285 }
        - { when: { quality: xhigh, resolution: 4k }, usd: 0.495 }
        - { when: { quality: max, resolution: 1k }, usd: 0.375 }
        - { when: { quality: max, resolution: 2k }, usd: 0.615 }
        - { when: { quality: max, resolution: 4k }, usd: 1.015 }
    categories: [image-to-image]
    parameters:
      - { id: parameter_prompt, required: true }
      - { id: parameter_images, required: true, constraints: { min: 1 } }
      - { id: parameter_aspect_ratio, required: false, defaultValue: 1:1, allowedValues: [1:1, 1:2, 2:1, 1:3, 3:1, 2:3, 3:2, 3:4, 4:3, 4:5, 5:4, 9:16, 16:9, 9:21, 21:9] }
      - { id: parameter_resolution, required: true, defaultValue: 1k, allowedValues: [1k, 2k, 4k] }
      - { id: parameter_quality, required: true, defaultValue: medium, allowedValues: [low, medium, high, xhigh, max] }
      - { id: parameter_output_format, required: false, defaultValue: png, allowedValues: [png, jpeg, webp] }

