# Matching edit endpoints for the image families.
models:
  - id: openai/gpt-image-2/edit
    name: GPT Image 2 Edit
    provider: openai
    description: >
      Instruction-driven GPT Image 2 edit. Prefer for object add/remove, background swap, and in-image text fixes. Accepts up to 16 source images. Edit costs slightly more than the matching generate cell.
    promptingTechnics:
      - Explicitly separate what should change ("Change only X") from what must remain untouched (identity, pose, lighting, layout).
      - When passing multiple reference images, assign each image a distinct role (e.g., Image 1 for subject identity, Image 2 for background).
      - Describe how added or modified elements integrate with existing perspective, lighting direction, and cast shadows.
      - Quote exact replacement text verbatim and make one focused edit per iteration to prevent drift.
    selectionGuidance:
      - Shines at instruction-driven object addition/removal, background replacement, multi-image compositing (up to 16 references), and fixing or localizing in-image text.
      - Avoid for fast, low-latency iterative retouching where GPT Image 2.5 Flare Edit is faster and more economical, or ultra-delicate identity preservation where 2.5 Sunburst Edit excels.
      - Medium quality at 1k balances speed, edit accuracy, and efficiency for most retouches; higher quality and resolution tiers noticeably increase processing time and resource usage.
    contextWindow: ~
    pricing:
      unit: parameter_table
      rate:
        - { when: { quality: low, resolution: 1k }, usd: 0.02 }
        - { when: { quality: low, resolution: 2k }, usd: 0.03 }
        - { when: { quality: low, resolution: 4k }, usd: 0.04 }
        - { when: { quality: medium, resolution: 1k }, usd: 0.07 }
        - { when: { quality: medium, resolution: 2k }, usd: 0.11 }
        - { when: { quality: medium, resolution: 4k }, usd: 0.19 }
        - { when: { quality: high, resolution: 1k }, usd: 0.23 }
        - { when: { quality: high, resolution: 2k }, usd: 0.41 }
        - { when: { quality: high, resolution: 4k }, usd: 0.73 }
    categories: [image-to-image]
    parameters:
      - { id: parameter_prompt, required: true }
      - { id: parameter_images, required: true, constraints: { min: 1 } }
      - {
          id: parameter_aspect_ratio,
          required: false,
          defaultValue: 1:1,
          allowedValues:
            [
              1:1,
              1:2,
              2:1,
              1:3,
              3:1,
              2:3,
              3:2,
              3:4,
              4:3,
              4:5,
              5:4,
              9:16,
              16:9,
              9:21,
              21:9,
            ],
        }
      - {
          id: parameter_resolution,
          required: true,
          defaultValue: 1k,
          allowedValues: [1k, 2k, 4k],
        }
      - {
          id: parameter_quality,
          required: true,
          defaultValue: medium,
          allowedValues: [low, medium, high],
        }
      - {
          id: parameter_output_format,
          required: false,
          defaultValue: png,
          allowedValues: [png, jpeg, webp],
        }

  - id: openai/gpt-image-2.5-flare/edit
    name: GPT Image 2.5 Flare Edit
    provider: openai
    description: >
      Faster GPT Image 2.5 edit. Prefer for iterative retouching. Use xhigh/max only when identity or typography must stay exact. Up to 16 source images.
    promptingTechnics:
      - Structure edit prompts into Edit Target, Preserve, Reference Roles, Integration, and Exclusions.
      - Assign a clear role to every uploaded reference image (subject, wardrobe, product, or style) in upload order.
      - Make one targeted change per pass and restate critical preservation rules so unedited regions do not drift.
      - Quote exact copy for typography edits and specify matching lighting, perspective, and surface texture.
    selectionGuidance:
      - Shines at multi-step iterative retouching, wardrobe or prop swaps, and multi-reference scene assembly (up to 16 images) when responsiveness matters.
      - Avoid when a single pass must lock intricate brand packaging, micro-typography, or strict facial likeness across complex lighting changes (prefer GPT Image 2.5 Sunburst Edit).
      - Offers faster turnaround and lower resource consumption than GPT Image 2 Edit at medium and high settings; step up to xhigh or max only when finer preservation is essential.
