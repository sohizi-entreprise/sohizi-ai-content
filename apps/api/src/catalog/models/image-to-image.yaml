  - id: google/nano-banana-pro/edit
    name: Nano Banana Pro Edit
    provider: google
    description: >
      Top Nano Banana edit. Prefer for style transfer and local changes when GPT Image fidelity is unnecessary. Up to 14 source images. Same resolution prices as generate.
    promptingTechnics:
      - Start with a direct action verb describing the exact modification (e.g., "Replace the background with...", "Change the jacket to...").
      - Clearly define the role of each reference image (e.g., "Use Image 1 for character pose, Image 2 for art style, Image 3 for environment").
      - Assign consistent names to recurring characters or objects across references and state what must stay unchanged.
      - Specify camera angle, lighting integration, and quoted text when reframing or restyling a scene.
    selectionGuidance:
      - Shines at artistic style transfers, reframing scenes from new camera angles, relighting, and multi-reference character/environment blending (up to 14 images).
      - Avoid when surgical pixel-level typography replacement or strict UI layout preservation is the main goal (prefer GPT Image 2.5 Sunburst Edit).
      - 1k and 2k edits carry the same resource weight with brisk turnaround, so prefer 2k by default and step up to 4k only when final print/UHD detail is required.
    contextWindow: ~
    pricing:
      unit: parameter_table
      rate:
        - { when: { resolution: 1k }, usd: 0.14 }
        - { when: { resolution: 2k }, usd: 0.14 }
        - { when: { resolution: 4k }, usd: 0.24 }
    categories: [image-to-image]
    parameters:
      - { id: parameter_prompt, required: true }
      - { id: parameter_images, required: true, constraints: { min: 1 } }
      - {
          id: parameter_aspect_ratio,
          required: false,
          defaultValue: 1:1,
          allowedValues: [1:1, 3:2, 2:3, 3:4, 4:3, 4:5, 5:4, 9:16, 16:9, 21:9],
        }
      - {
