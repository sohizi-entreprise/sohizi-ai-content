  - id: kwaivgi/kling-video-o3-pro/text-to-video
    name: Kling O3 Pro
    provider: kwaivgi
    description: >
      Highest Kling O3 text-to-video. Prefer for character-accurate motion and optional native sound. Duration 3-15s. Price scales with duration only ($0.112/s). Aspect ratios 16:9, 9:16, 1:1.
    promptingTechnics:
      - Start from the camera move (one named move with start and end points), then build the subject action, setting, lighting, and sound around it.
      - Write motion as a 2-3 link physical cause-and-effect chain (e.g., "A clips B, causing C to stumble and catch the railing") rather than generic motion adjectives.
      - For multi-shot clips, use labeled shots with durations (e.g., "Shot 1 (2s) wide shot... Shot 2 (3s) close-up..."); for single takes, write one continuous description.
      - When generate_audio is enabled, place spoken dialogue in quotes after "says:" and link SFX to visible actions plus an ambient bed.
    selectionGuidance:
      - Shines at physics-heavy human action, expressive character motion, camera-first showpiece shots, and timed multi-shot cuts (3-15s) with optional synchronized sound.
      - Avoid when you need conditioning from reference video/audio tracks or ultra-wide 21:9 framing (prefer Seedance 2.5), or when you need a dedicated negative prompt field (prefer Kling V3.0 Pro).
      - Resource usage scales strictly with duration rather than resolution tiers, offering a predictable and much lighter footprint than high-res Seedance while maintaining high motion realism.
    contextWindow: ~
    pricing:
      unit: parameter_table
      rate:
        - { when: { duration: 3 }, usd: 0.336 }
        - { when: { duration: 4 }, usd: 0.448 }
        - { when: { duration: 5 }, usd: 0.56 }
