    promptingTechnics:
      - Use ordered shot blocks (Shot 1, Shot 2) rather than exact second ranges, keeping action density matched to the 4-15s duration.
      - Lead each shot with camera framing and one camera move, followed by subject action, lighting, and sound cues.
      - Keep reference uploads to 4-5 focused assets with explicit role assignments to avoid style conflicts during fast previews.
    selectionGuidance:
