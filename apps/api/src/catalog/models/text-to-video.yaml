  - id: kwaivgi/kling-video-o3-std/text-to-video
    name: Kling O3 Std
    provider: kwaivgi
    description: >
      Cheaper Kling O3 generate. Prefer for drafts before promoting to Pro. Same 3-15s window at $0.084/s.
    promptingTechnics:
      - Prompt like a shot list — camera framing and one movement → subject and cause-and-effect action → setting and lighting → audio cues.
      - Use labeled shots with durations (e.g., "Shot 1 (2s) ...") for multi-shot sequences or a single continuous paragraph for one-take clips.
      - Keep physical action chains to 2-3 clear beats so motion remains coherent in draft runs.
    selectionGuidance:
