  - id: bytedance/seedance-2.0/text-to-video
    name: Seedance 2.0
    provider: bytedance
    description: >
      Previous Seedance generate. Prefer when 2.5 is more than the shot needs. Duration 4-15s, fewer reference slots than 2.5. Same resolution ladder at a lower per-second rate.
    promptingTechnics:
      - Sequence multi-shot clips using ordered shot labels (Shot 1, Shot 2, Shot 3) with explicit cut phrases ("cut to...") rather than second-level timestamps, which are unstable on 2.0.
      - Order each shot block as camera move/framing → subject action and expression → environment/lighting → audio, ending with a continuity lock line.
      - Limit reference assets to 4-5 total (1-2 character images, 1 scene image, 1 motion video, 1 audio clip) and assign each a single role.
      - Use one clear camera movement per shot (or state "locked camera" in prose) and include constraints like "no subtitles, no logo, no watermark".
    selectionGuidance:
      - Shines at multi-shot narrative sequences (4-15s) with native audio and moderate reference anchoring (up to 9 images, 3 videos, 3 audios) when Seedance 2.5's 30s ceiling is unnecessary.
      - Avoid when you need second-accurate timeline beat control or more than 15 seconds of continuous action (prefer Seedance 2.5).
      - More economical per second than Seedance 2.5 across all resolutions, though 1080p and 4k still carry a steep resource and latency multiplier over 720p.
    contextWindow: ~
    pricing:
