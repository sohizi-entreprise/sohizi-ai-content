    name: Gemini Omni 1.1 Flash
    provider: google
    description: >
      Newest Gemini Omni generate. Prefer for cheap, short clips with explicit resolution control (360p-4k). Duration 3-10s. Start at 720p; 4k is 3x 720p.
    promptingTechnics:
      - Follow the five-element structure in order — shot framing and camera motion → visual style → lighting → location → focused subject action.
      - Dedicate each short clip (3-10s) to a single focused moment and include "in a single unbroken scene" or "no scene cuts" to prevent unwanted cuts.
      - Format spoken dialogue using a colon without quotation marks (e.g., A woman says — My name is Clara, using a colon before the spoken line) so the model does not render burned-in text on screen.
      - Describe audio explicitly and add "no music" or "no dialogue" when a clean ambient or foley track is required.
    selectionGuidance:
      - Shines at fast, single-moment commercial b-roll, social clips (16:9 or 9:16), and rapid video ideation from 360p roughs up to 4k finals (3-10s).
      - Avoid for clips longer than 10 seconds, non-standard aspect ratios (such as 1:1 or 21:9), or complex multi-event storylines in a single pass.
      - 360p and 720p offer exceptionally low latency and resource usage for exploration, while 1080p and 4k scale up fidelity at a moderate increase in processing time and footprint.
