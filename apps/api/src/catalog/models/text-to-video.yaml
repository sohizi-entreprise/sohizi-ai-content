# Seedance, Kling, and Gemini Omni generate endpoints.
models:
  - id: bytedance/seedance-2.5/text-to-video
    name: Seedance 2.5
    provider: bytedance
    description: >
      Best Seedance generate. Prefer for cinematic text-to-video with native audio and optional reference images/video/audio. Duration 4-30s. Price is linear with duration and jumps hard at 1080p/4k. Start at 720p / 5s.
    promptingTechnics:
      - Use the four-part structure — Asset mapping (@Image1/@Video1/@Audio1 roles) + one-sentence scene brief + continuous second-level timeline (e.g., 0-3s, 3-5s) + global constraints.
      - Bind each reference asset to one clear responsibility and state what NOT to copy from it (e.g., "@Image1 controls identity only; do not copy background").
      - Specify camera movement path and timing separately from subject action.
      - Direct native audio explicitly (quoted dialogue, contact SFX, room tone, BGM or silence) and add global constraints like "no subtitles, no watermark".
    selectionGuidance:
      - Shines at flagship cinematic clips up to 30 seconds with synchronized native dialogue/SFX and rich multimodal conditioning (up to 30 reference images, 10 videos, and 10 audio tracks).
      - Avoid for quick roughs or simple 5-second b-roll where Seedance 2.0 Fast, Kling O3 Std, or Gemini Omni 1.1 Flash delivers much faster and lighter results.
      - Latency and resource consumption scale linearly with duration and jump steeply at 1080p and 4k; always block out timing and motion at 480p or 720p for 5 seconds before committing to long high-resolution renders.
    contextWindow: ~
    pricing:
      unit: parameter_table
