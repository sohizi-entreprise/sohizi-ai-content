      - Avoid for final hero shots requiring peak texture fidelity or complex 20-30s choreography (promote approved prompts to Seedance 2.0 or 2.5).
      - Lowest latency and lightest per-second resource footprint in the Seedance family, especially at 480p and 720p, making it the best entry point for iterative prompting.
