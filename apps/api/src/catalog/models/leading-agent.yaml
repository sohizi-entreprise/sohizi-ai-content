# Frontier models for the primary conversational agent. Prices are official
# standard short-context USD per 1M tokens. Long-context surcharges stay in the description.
models:
  - id: openai/gpt-6-astra
    name: GPT-6 Astra
    provider: openai
    description: >
      Pick as the lead agent for the hardest end-to-end work: long-running tool use,
      research, coding, and document creation. Highest OpenAI capability and cost.
      Does not support reasoning_effort none; start at low. Prompts above 272k tokens
      use the long-context rate.
    contextWindow: 1_050_000
    pricing:
      { unit: per_1m_tokens, input: 10.00, output: 50.00, cached_input: 1.00 }
    categories: [leading-agent]
    parameters:
      - {
          id: parameter_temperature,
          required: false,
          defaultValue: 1,
          constraints: { min: 0, max: 2, step: 0.1 },
        }
      - {
          id: parameter_max_output_tokens,
          required: false,
          constraints: { min: 1, max: 128000 },
        }
      - {
          id: parameter_reasoning_effort,
          required: false,
          defaultValue: medium,
          allowedValues: [low, medium, high, xhigh, max],
        }

  - id: openai/gpt-6-sol
    name: GPT-6 Sol
    provider: openai
    description: >
      Default OpenAI lead when Astra is more than the task needs. Near-Astra quality
      for complex professional work at a much lower token price. Supports reasoning_effort none.
      Prompts above 272k tokens use the long-context rate.
    contextWindow: 1_050_000
    pricing:
      { unit: per_1m_tokens, input: 2.00, output: 10.00, cached_input: 0.20 }
    categories: [leading-agent]
    parameters:
      - {
          id: parameter_temperature,
          required: false,
          defaultValue: 1,
          constraints: { min: 0, max: 2, step: 0.1 },
        }
      - {
          id: parameter_max_output_tokens,
          required: false,
          constraints: { min: 1, max: 128000 },
        }
      - {
          id: parameter_reasoning_effort,
          required: false,
          defaultValue: medium,
          allowedValues: [none, low, medium, high, xhigh],
        }

  - id: openai/gpt-5.6-sol
    name: GPT-5.6 Sol
    provider: openai
    description: >
      Previous OpenAI flagship. Use when a pinned GPT-5.6 behavior is required or
      when comparing against GPT-6 Sol. Prompts above 272k tokens use 2x input and
      1.5x output for the full session.
    contextWindow: 1_050_000
    pricing:
      { unit: per_1m_tokens, input: 4.00, output: 20.00, cached_input: 0.40 }
