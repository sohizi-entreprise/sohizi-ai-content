# Frontier models for the primary conversational agent. Prices are official
# USD per 1M tokens (using the highest context-tier / standard rate where tiered).
models:
  - id: openai/gpt-6.1-sol
    name: GPT-6.1 Sol
    provider: openai
    description: >
      Newest OpenAI Sol-tier lead for coding, tool use, and long-horizon agent
      workflows. Does not support reasoning_effort none or minimal; start at low
      (defaults to medium). Listed at the >272k long-context rate ($2 / $10 /
      $0.10 cached at <=272k tokens).
    contextWindow: 1_050_000
    pricing:
      { unit: per_1m_tokens, input: 4.00, output: 15.00, cached_input: 0.20 }
    categories: [leading-agent]
    parameters:
      - {
          id: parameter_temperature,
          required: false,
          defaultValue: 1,
          constraints: { min: 0, max: 2, step: 0.1 },
        }
      - {
          id: parameter_max_output_tokens,
          required: false,
          constraints: { min: 1, max: 128000 },
        }
      - {
          id: parameter_reasoning_effort,
          required: false,
          defaultValue: medium,
          allowedValues: [low, medium, high, xhigh, max],
        }

