  - id: microsoft/mai-image-2.5-pro/text-to-image
    name: MAI Image 2.5 Pro
    provider: microsoft
    description: >
      Highest MAI still generate. Prefer for cinematic lighting and illustration when GPT Image / Nano Banana are a poor stylistic match. Flat per-image price; aspect ratio does not change cost.
    promptingTechnics:
      - Layer details in order — subject (shape, material, finish) → visual register/style → lighting direction → composition/layout zones → mood.
      - Name the exact photography or illustration register (e.g., "editorial product photography", "flat vector illustration", "cinematic wide-angle").
      - Anchor in-image text by quoting exact wording and specifying position, relative size, and font weight.
      - Avoid mixing conflicting art styles in a single prompt; keep lighting and material descriptors specific.
    selectionGuidance:
      - Shines at dramatic chiaroscuro or studio lighting, editorial magazine covers, stylized key art, and clean vector/educational illustrations with short headline text.
      - Avoid when ultra-high 4k native pixel dimensions or extreme panoramic ratios (like 8:1) are required.
      - Predictable flat resource usage per run regardless of aspect ratio, trading slightly higher latency and footprint than standard MAI Image 2.5 for superior lighting depth and material realism.
    contextWindow: ~
    pricing:
      unit: per_inference
      rate: 0.18
    categories: [text-to-image]
    parameters:
      - { id: parameter_prompt, required: true }
      - {
          id: parameter_aspect_ratio,
          required: false,
          defaultValue: 1:1,
          allowedValues: [1:1, 4:3, 3:4, 16:9, 9:16, 3:2, 2:3],
        }
      - {
          id: parameter_output_format,
          required: false,
          defaultValue: png,
          allowedValues: [jpeg, png, webp],
        }

  - id: microsoft/mai-image-2.5/text-to-image
    name: MAI Image 2.5
    provider: microsoft
    description: >
      Cheaper MAI generate. Prefer for volume stills and style exploration. Uses size for aspect ratio. Flat per-image price.
    promptingTechnics:
      - Lead with a specific subject description (materials, colors, silhouette) followed by style, lighting setup, and framing.
      - Quote verbatim any short text or labels and explicitly define where they sit in the composition.
      - Specify concrete lighting ("soft window light from the left", "golden hour backlighting") rather than generic praise words.
      - Change one prompt variable at a time when exploring styles or compositions.
    selectionGuidance:
      - Shines at high-volume style exploration, social posts, lifestyle illustrations, and everyday marketing visuals with short labels or titles.
      - Avoid for hero deliverables demanding deep cinematic shadow roll-off (prefer MAI Image 2.5 Pro) or multi-paragraph text rendering (prefer GPT Image 2.5).
      - Fast turnaround and a flat, lightweight resource footprint across all supported aspect ratios make it ideal for broad creative exploration before locking a final look.
    contextWindow: ~
    pricing:
      unit: per_inference
      rate: 0.05
    categories: [text-to-image]
    parameters:
      - { id: parameter_prompt, required: true }
      - {
          id: parameter_aspect_ratio,
          required: false,
          defaultValue: 1:1,
          allowedValues: [21:9, 16:9, 3:2, 4:3, 5:4, 1:1, 4:5, 3:4, 2:3, 9:16],
        }
      - {
          id: parameter_output_format,
          required: false,
          defaultValue: png,
          allowedValues: [jpeg, png, webp],
        }
