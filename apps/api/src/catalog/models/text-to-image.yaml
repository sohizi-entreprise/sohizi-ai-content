  - id: openai/gpt-image-2.5-sunburst/text-to-image
    name: GPT Image 2.5 Sunburst
    provider: openai
    description: >
      Highest GPT Image 2.5 generate. Prefer for hero frames, brand layouts, and dense typography. Same price grid as Flare; pick Sunburst when composition accuracy matters more than turnaround.
    promptingTechnics:
      - Organize complex layouts into clear labeled sections (Deliverable, Subject, Scene, Composition, Visual Direction, Text, and Constraints).
      - For dense typography, infographics, or UI layouts, quote exact copy, spell unusual brand names letter-by-letter if needed, and define hierarchy and placement.
      - Specify exact material finishes, light source geometry, negative space, and color palette rather than mood buzzwords.
      - Explicitly forbid unwanted elements ("no watermarks, no extra labels, no background text") in a dedicated constraints block.
    selectionGuidance:
      - Shines at hero campaign visuals, complex brand layouts, UI/slide mockups, infographics, and scenes with dense or multi-font typography requiring strict compositional accuracy.
      - Avoid for quick throwaway drafts, moodboards, or bulk ideation where GPT Image 2.5 Flare or Nano Banana 2 delivers faster turnaround.
      - Prioritizes maximum compositional fidelity over latency; iterate layout structure at medium/1k first, then promote to high, xhigh, or max at 2k/4k only on the final approved prompt to manage turnaround time and spend.
