  - id: google/nano-banana-2/text-to-image-fast
    name: Nano Banana 2 Fast
    provider: google
    description: >
      Speed-tier Nano Banana 2. Only 2k and 4k. Prefer for rapid iteration at about half the 2k cost of the standard endpoint.
    promptingTechnics:
      - Write focused, concrete prompts with subject, action, setting, camera angle, and lighting for rapid concept iteration.
      - Use positive phrasing instead of exclusions, and specify lens/lighting terms to lock the aesthetic quickly.
      - Quote any required display text and state its typography style and placement.
    selectionGuidance:
      - Shines at rapid high-resolution (2k and 4k) concept iteration, social media creatives, and wide/vertical banners when turnaround speed matters.
      - Avoid when you need 0.5k/1k thumbnails or the subtle lighting and texture refinement of Nano Banana Pro or GPT Image 2.5 Sunburst.
      - Optimized for velocity and efficiency at 2k and 4k with minimal resource overhead difference between the two tiers, making it ideal for high-volume high-res workflows.
    contextWindow: ~
    pricing:
      unit: parameter_table
      rate:
