  - id: google/nano-banana-pro/text-to-image
    name: Nano Banana Pro
    provider: google
    description: >
      Top Nano Banana generate. Prefer for stylized stills and fast concept frames when GPT Image text rendering is not required. 1k and 2k cost the same; 4k is the premium step.
    promptingTechnics:
      - Direct the scene like a creative director covering subject, action, location, composition, camera/lens, lighting, and film stock or color grading.
      - Use positive framing to describe what should be visible (e.g., "an empty street") rather than negative phrasing ("no cars").
      - Specify photographic hardware and optical cues (e.g., "85mm f/1.8 shallow depth of field", "three-point softbox lighting") and exact surface materiality.
      - Put rendered text in quotation marks with explicit typography style and placement instructions.
    selectionGuidance:
      - Shines at stylized concept art, editorial photography with rich lens/film character, character design, and culturally or factually grounded scenes.
      - Avoid when dense, multi-line typography or strict UI layout geometry is the primary requirement (prefer GPT Image 2.5 Sunburst).
      - 1k and 2k resolutions share the same resource footprint, making 2k the best default for sharp detail with low latency, whereas 4k carries a higher latency and budget premium.
    contextWindow: ~
    pricing:
      unit: parameter_table
      rate:
        - { when: { resolution: 1k }, usd: 0.14 }
        - { when: { resolution: 2k }, usd: 0.14 }
        - { when: { resolution: 4k }, usd: 0.24 }
    categories: [text-to-image]
    parameters:
      - { id: parameter_prompt, required: true }
      - {
          id: parameter_aspect_ratio,
          required: false,
          defaultValue: 1:1,
          allowedValues: [1:1, 3:2, 2:3, 3:4, 4:3, 4:5, 5:4, 9:16, 16:9, 21:9],
        }
      - {
          id: parameter_resolution,
          required: true,
          defaultValue: 1k,
          allowedValues: [1k, 2k, 4k],
        }
      - {
          id: parameter_output_format,
          required: false,
          defaultValue: png,
          allowedValues: [png, jpeg],
        }

  - id: google/nano-banana-2/text-to-image
    name: Nano Banana 2
    provider: google
    description: >
      Cheaper Nano Banana generate with ultra-wide ratios (1:8 / 8:1) and a 0.5k draft tier. Prefer for banners, storyboards, and volume stills. Use the fast endpoint when only 2k/4k is needed.
    promptingTechnics:
      - Open with a strong directive verb and specify subject, action, setting, framing, lighting, and visual medium.
      - Prefer positive visual descriptions over negative constraints, and name specific textures and color palettes.
      - For ultra-wide or vertical banners, describe spatial composition and negative space across the canvas.
      - Enclose any text to be rendered in quotes alongside font weight and position.
    selectionGuidance:
      - Shines at ultra-wide or ultra-tall panoramic banners (up to 8:1 and 1:8), multi-panel storyboards, and high-volume still generation.
      - Avoid when maximum photographic micro-texture or complex multi-font poster typography is required on the first pass.
      - Offers a 0.5k tier for ultra-fast, budget-friendly roughs and scales smoothly up to 4k; if 2k or 4k is your target resolution, Nano Banana 2 Fast is both faster and more economical.
    contextWindow: ~
    pricing:
      unit: parameter_table
      rate:
