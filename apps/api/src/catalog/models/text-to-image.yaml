# GPT Image 2 family, Nano Banana, and MAI generate endpoints.
models:
  - id: openai/gpt-image-2/text-to-image
    name: GPT Image 2
    provider: openai
    description: >
      Default GPT Image 2 generate. Prefer for photoreal scenes, product shots, and readable in-image text when 2.5 quality tiers are unnecessary. Quality and resolution drive price; start at medium / 1k.
    promptingTechnics:
      - Structure prompts as deliverable/use case → subject → scene → composition → lighting/materials → constraints.
      - Enclose exact required in-image text in quotation marks, specify font style and placement, and add "no extra text".
      - Use concrete physical descriptors (light direction, surface texture, camera framing) instead of vague quality adjectives.
      - State explicit exclusions at the end of the prompt to prevent unwanted props, logos, or background clutter.
    selectionGuidance:
      - Shines at photorealistic lifestyle scenes, e-commerce product shots, and posters or mockups that require accurate, readable in-image text.
      - Avoid when rapid, high-volume concept exploration is the priority (prefer GPT Image 2.5 Flare or Nano Banana 2 Fast) or when intricate multi-element brand layouts demand 2.5 Sunburst precision.
      - Medium quality at 1k resolution provides the sweet spot between visual fidelity, generation speed, and budget efficiency; stepping up to high quality or 4k substantially increases latency and credit usage.
    contextWindow: ~
    pricing:
      unit: parameter_table
      rate:
        - { when: { quality: low, resolution: 1k }, usd: 0.01 }
        - { when: { quality: low, resolution: 2k }, usd: 0.02 }
        - { when: { quality: low, resolution: 4k }, usd: 0.03 }
        - { when: { quality: medium, resolution: 1k }, usd: 0.06 }
        - { when: { quality: medium, resolution: 2k }, usd: 0.1 }
        - { when: { quality: medium, resolution: 4k }, usd: 0.18 }
        - { when: { quality: high, resolution: 1k }, usd: 0.22 }
        - { when: { quality: high, resolution: 2k }, usd: 0.4 }
        - { when: { quality: high, resolution: 4k }, usd: 0.72 }
    categories: [text-to-image]
    parameters:
      - { id: parameter_prompt, required: true }
      - {
          id: parameter_aspect_ratio,
          required: false,
          defaultValue: 1:1,
          allowedValues:
            [
              1:1,
              1:2,
              2:1,
              1:3,
              3:1,
              2:3,
              3:2,
              3:4,
              4:3,
              4:5,
              5:4,
              9:16,
              16:9,
              9:21,
              21:9,
            ],
        }
      - {
          id: parameter_resolution,
          required: true,
          defaultValue: 1k,
          allowedValues: [1k, 2k, 4k],
        }
      - {
          id: parameter_quality,
          required: true,
          defaultValue: medium,
          allowedValues: [low, medium, high],
        }
      - {
          id: parameter_output_format,
          required: false,
          defaultValue: png,
          allowedValues: [png, jpeg, webp],
        }

  - id: openai/gpt-image-2.5-flare/text-to-image
    name: GPT Image 2.5 Flare
    provider: openai
    description: >
      Faster GPT Image 2.5 generate. Prefer for drafts and iteration; use xhigh or max only when extra fidelity is worth the jump. Same quality/resolution grid as Sunburst at a lower default cost than GPT Image 2 high.
    promptingTechnics:
      - Lead with the deliverable type (e.g., product photo, UI mockup, poster), then order subject, scene, composition, visual direction, and constraints.
      - Quote exact text strings verbatim and state how many times and where each string should appear.
      - Describe human pose, gaze direction, hand interactions, and framing ("full body visible") explicitly.
      - Keep API settings (aspect ratio, quality, resolution) out of the prose prompt and iterate one variable at a time.
    selectionGuidance:
      - Shines at fast daily image generation, storyboard frames, ad variations, and iterative layout drafting where strong prompt adherence and readable text are needed quickly.
      - Avoid for final flagship campaign key art with dense micro-typography or complex spatial hierarchies where GPT Image 2.5 Sunburst is more reliable.
      - Delivers GPT Image 2-level quality with noticeably lower latency and better budget efficiency at medium/high tiers; reserve xhigh and max tiers only for final passes as they trade speed and economy for peak detail.
