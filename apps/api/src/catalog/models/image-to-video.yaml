# Matching image-to-video endpoints. Prices match the text-to-video sibling where measured.
models:
  - id: bytedance/seedance-2.5/image-to-video
    name: Seedance 2.5
    provider: bytedance
    description: >
      Best Seedance image-to-video. Prefer when a start frame (and optional last frame) should lock identity. Same duration/resolution prices as text-to-video. Duration 4-30s.
    promptingTechnics:
      - Do not re-describe static details already visible in the start image; focus the prompt on what moves next, how the camera travels, and the ending state.
      - Use continuous second-level timeline beats (e.g., 0-3s, 3-5s) to pace actions from the starting frame to the final frame.
      - When supplying a last_image, describe the physical transition path and camera motion that bridges the first and last frames naturally.
      - Specify synchronized audio (dialogue, action SFX, ambient room tone) and add constraints like "preserve subject identity, no subtitles, no watermark".
    selectionGuidance:
      - Shines at high-end character and product animation from a start frame (plus optional end frame) over long 4-30s durations with synchronized native speech and sound effects.
      - Avoid for simple 3-5s parallax motion or quick tests where Seedance 2.0 Fast, Kling O3 Std, or Gemini Omni 1.1 Flash is much faster and lighter.
      - Duration and resolution (especially 1080p and 4k) heavily impact latency and resource consumption; validate motion trajectories at 720p and 5s before rendering extended high-res takes.
