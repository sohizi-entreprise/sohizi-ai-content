# Cheap, fast, still-capable models for summarization, exploration, and sub-agents.
# Prices are official standard short-context USD per 1M tokens.
models:
  - id: openai/gpt-6-luna
    name: GPT-6 Luna
    provider: openai
    description: >
      Fastest current OpenAI text model. Prefer for high-volume summarization,
      classification, and extraction. Supports reasoning_effort none. Prompts
      above 272k tokens use the long-context rate.
    contextWindow: 1_050_000
    pricing: { unit: per_1m_tokens, input: 0.10, output: 0.50, cached_input: 0.01 }
    categories: [text-to-text]
    parameters:
      - { id: parameter_temperature, required: false, defaultValue: 1, constraints: { min: 0, max: 2, step: 0.1 } }
      - { id: parameter_max_output_tokens, required: false, constraints: { min: 1, max: 128000 } }
      - { id: parameter_reasoning_effort, required: false, defaultValue: none, allowedValues: [none, low, medium, high] }

  - id: openai/gpt-5.4-mini
    name: GPT-5.4 Mini
    provider: openai
    description: >
      Smallest GPT-5.4-class model that still holds up on tool calling and
      short agent loops. Prefer over Luna when instruction following matters
      more than raw throughput.
    contextWindow: 400_000
    pricing: { unit: per_1m_tokens, input: 0.75, output: 4.50, cached_input: 0.075 }
    categories: [text-to-text]
    parameters:
      - { id: parameter_temperature, required: false, defaultValue: 1, constraints: { min: 0, max: 2, step: 0.1 } }
      - { id: parameter_max_output_tokens, required: false, constraints: { min: 1, max: 128000 } }
      - { id: parameter_reasoning_effort, required: false, defaultValue: none, allowedValues: [none, low, medium, high, xhigh] }

  - id: openai/gpt-5.4-nano
    name: GPT-5.4 Nano
    provider: openai
    description: >
      Cheapest GPT-5.4-class model. Use for titles, tags, short rewrites, and
      other low-stakes text. Skip when the task needs multi-step reasoning.
    contextWindow: 400_000
    pricing: { unit: per_1m_tokens, input: 0.20, output: 1.25, cached_input: 0.02 }
    categories: [text-to-text]
    parameters:
      - { id: parameter_temperature, required: false, defaultValue: 1, constraints: { min: 0, max: 2, step: 0.1 } }
      - { id: parameter_max_output_tokens, required: false, constraints: { min: 1, max: 128000 } }
      - { id: parameter_reasoning_effort, required: false, defaultValue: none, allowedValues: [none, low, medium, high] }

  - id: openai/gpt-5-mini
    name: GPT-5 Mini
    provider: openai
    description: >
      Balanced OpenAI mini for exploration and summarization. Cheaper than
      5.4 Mini and stronger than Nano on multi-step instructions.
    contextWindow: 400_000
    pricing: { unit: per_1m_tokens, input: 0.25, output: 2.00, cached_input: 0.025 }
    categories: [text-to-text]
    parameters:
      - { id: parameter_temperature, required: false, defaultValue: 1, constraints: { min: 0, max: 2, step: 0.1 } }
      - { id: parameter_max_output_tokens, required: false, constraints: { min: 1, max: 128000 } }
      - { id: parameter_reasoning_effort, required: false, defaultValue: none, allowedValues: [none, low, medium, high] }

  - id: openai/gpt-4.1-mini
    name: GPT-4.1 Mini
    provider: openai
    description: >
      Fast non-reasoning OpenAI mini with a 1M context window. Prefer for long
      document skim/summarize jobs that do not need a reasoning step.
    contextWindow: 1_047_576
    pricing: { unit: per_1m_tokens, input: 0.40, output: 1.60, cached_input: 0.10 }
    categories: [text-to-text]
    parameters:
      - { id: parameter_temperature, required: false, defaultValue: 1, constraints: { min: 0, max: 2, step: 0.1 } }
      - { id: parameter_max_output_tokens, required: false, constraints: { min: 1, max: 32768 } }

  - id: anthropic/claude-haiku-4-5
    name: Claude Haiku 4.5
    provider: anthropic
    description: >
      Fastest Anthropic text model. Prefer for classification, short summaries,
      and high-volume extraction. 200k context; skip for long project-wide reads.
    contextWindow: 200_000
    pricing: { unit: per_1m_tokens, input: 1.00, output: 5.00, cached_input: 0.10 }
    categories: [text-to-text]
    parameters:
      - { id: parameter_temperature, required: false, defaultValue: 1, constraints: { min: 0, max: 1, step: 0.1 } }
      - { id: parameter_max_output_tokens, required: false, constraints: { min: 1, max: 64000 } }

  - id: anthropic/claude-sonnet-5
    name: Claude Sonnet 5
    provider: anthropic
    description: >
      Default Anthropic worker for exploration, rewriting, and mid-size summaries.
      1M context at the current $2 / $10 list price. Prefer over 4.x Sonnet for new work.
    contextWindow: 1_000_000
    pricing: { unit: per_1m_tokens, input: 2.00, output: 10.00, cached_input: 0.20 }
    categories: [text-to-text]
    parameters:
      - { id: parameter_temperature, required: false, defaultValue: 1, constraints: { min: 0, max: 1, step: 0.1 } }
      - { id: parameter_max_output_tokens, required: false, constraints: { min: 1, max: 128000 } }
      - { id: parameter_reasoning_effort, required: false, defaultValue: high, allowedValues: [low, medium, high] }

  - id: anthropic/claude-sonnet-5-5
    name: Claude Sonnet 5.5
    provider: anthropic
    description: >
      Newest Sonnet. Prefer when the worker needs stronger instruction following
      than Sonnet 5 at the same $2 / $10 list price.
    contextWindow: 1_000_000
    pricing: { unit: per_1m_tokens, input: 2.00, output: 10.00, cached_input: 0.20 }
    categories: [text-to-text]
    parameters:
      - { id: parameter_temperature, required: false, defaultValue: 1, constraints: { min: 0, max: 1, step: 0.1 } }
      - { id: parameter_max_output_tokens, required: false, constraints: { min: 1, max: 128000 } }
      - { id: parameter_reasoning_effort, required: false, defaultValue: high, allowedValues: [low, medium, high] }

  - id: anthropic/claude-sonnet-4-6
    name: Claude Sonnet 4.6
    provider: anthropic
    description: >
      Late Sonnet 4.x worker. Higher list price than Sonnet 5. Use only when a
      pinned 4.6 behavior is required.
    contextWindow: 1_000_000
    pricing: { unit: per_1m_tokens, input: 3.00, output: 15.00, cached_input: 0.30 }
    categories: [text-to-text]
    parameters:
      - { id: parameter_temperature, required: false, defaultValue: 1, constraints: { min: 0, max: 1, step: 0.1 } }
      - { id: parameter_max_output_tokens, required: false, constraints: { min: 1, max: 64000 } }
      - { id: parameter_reasoning_effort, required: false, defaultValue: high, allowedValues: [low, medium, high] }

  - id: anthropic/claude-sonnet-4-5
    name: Claude Sonnet 4.5
    provider: anthropic
    description: >
      Earlier Sonnet 4.x worker at the same $3 / $15 list price as 4.6. Prefer
      Sonnet 5 for new summarization and exploration jobs.
    contextWindow: 1_000_000
    pricing: { unit: per_1m_tokens, input: 3.00, output: 15.00, cached_input: 0.30 }
    categories: [text-to-text]
    parameters:
      - { id: parameter_temperature, required: false, defaultValue: 1, constraints: { min: 0, max: 1, step: 0.1 } }
      - { id: parameter_max_output_tokens, required: false, constraints: { min: 1, max: 64000 } }
      - { id: parameter_reasoning_effort, required: false, defaultValue: high, allowedValues: [low, medium, high] }

  - id: google/gemini-3.5-flash
    name: Gemini 3.5 Flash
    provider: google
    description: >
      Strongest Google Flash worker. Prefer for grounded exploration and summaries
      that still need to stay cheap. 1M context. Not a pro-family model.
    contextWindow: 1_048_576
    pricing: { unit: per_1m_tokens, input: 1.50, output: 9.00, cached_input: 0.15 }
    categories: [text-to-text]
    parameters:
      - { id: parameter_temperature, required: false, defaultValue: 1, constraints: { min: 0, max: 2, step: 0.1 } }
      - { id: parameter_max_output_tokens, required: false, constraints: { min: 1, max: 65536 } }
      - { id: parameter_reasoning_effort, required: false, defaultValue: medium, allowedValues: [low, medium, high] }

  - id: google/gemini-3-flash-preview
    name: Gemini 3 Flash
    provider: google
    description: >
      Previous Gemini 3 Flash. Cheaper than 3.5 Flash. Prefer for routine
      summarization and file exploration when 3.5 quality is unnecessary.
    contextWindow: 1_048_576
    pricing: { unit: per_1m_tokens, input: 0.50, output: 3.00, cached_input: 0.05 }
    categories: [text-to-text]
    parameters:
      - { id: parameter_temperature, required: false, defaultValue: 1, constraints: { min: 0, max: 2, step: 0.1 } }
      - { id: parameter_max_output_tokens, required: false, constraints: { min: 1, max: 65536 } }
      - { id: parameter_reasoning_effort, required: false, defaultValue: medium, allowedValues: [low, medium, high] }

  - id: google/gemini-2.5-flash
    name: Gemini 2.5 Flash
    provider: google
    description: >
      Stable Gemini 2.5 Flash with a 1M window and thinking budgets. Prefer when
      you need a non-preview Google worker for long-context skim jobs.
    contextWindow: 1_048_576
    pricing: { unit: per_1m_tokens, input: 0.30, output: 2.50, cached_input: 0.03 }
    categories: [text-to-text]
    parameters:
      - { id: parameter_temperature, required: false, defaultValue: 1, constraints: { min: 0, max: 2, step: 0.1 } }
      - { id: parameter_max_output_tokens, required: false, constraints: { min: 1, max: 65536 } }
      - { id: parameter_reasoning_effort, required: false, defaultValue: medium, allowedValues: [low, medium, high] }

  - id: google/gemini-3.1-flash-lite
    name: Gemini 3.1 Flash-Lite
    provider: google
    description: >
      High-volume Google worker for translation, tagging, and simple extraction.
      Audio input is billed higher than text. Skip for nuanced writing.
    contextWindow: 1_048_576
    pricing: { unit: per_1m_tokens, input: 0.25, output: 1.50, cached_input: 0.025 }
    categories: [text-to-text]
    parameters:
      - { id: parameter_temperature, required: false, defaultValue: 1, constraints: { min: 0, max: 2, step: 0.1 } }
      - { id: parameter_max_output_tokens, required: false, constraints: { min: 1, max: 65536 } }

  - id: google/gemini-2.5-flash-lite
    name: Gemini 2.5 Flash-Lite
    provider: google
    description: >
      Cheapest Google text model in this set. Use for titles, tags, and bulk
      classification. Weakest Flash-Lite on hard instructions.
    contextWindow: 1_048_576
    pricing: { unit: per_1m_tokens, input: 0.10, output: 0.40, cached_input: 0.01 }
    categories: [text-to-text]
    parameters:
      - { id: parameter_temperature, required: false, defaultValue: 1, constraints: { min: 0, max: 2, step: 0.1 } }
      - { id: parameter_max_output_tokens, required: false, constraints: { min: 1, max: 65536 } }

  - id: xai/grok-4.5
    name: Grok 4.5
    provider: xai
    description: >
      Strong cheap Grok worker just below the 4.6 lead. Prefer for exploration
      and synthesis that still needs Grok-class reasoning. Prompts at or above
      200k tokens bill the whole request at $4 / $12 per 1M.
    contextWindow: 500_000
    pricing: { unit: per_1m_tokens, input: 2.00, output: 6.00, cached_input: 0.30 }
    categories: [text-to-text]
    parameters:
      - { id: parameter_temperature, required: false, defaultValue: 1, constraints: { min: 0, max: 2, step: 0.1 } }
      - { id: parameter_max_output_tokens, required: false, constraints: { min: 1, max: 128000 } }
      - { id: parameter_reasoning_effort, required: false, defaultValue: high, allowedValues: [low, medium, high] }

  - id: xai/grok-4.3
    name: Grok 4.3
    provider: xai
    description: >
      Best Grok value for long-context summarization. 1M window and $1.25 / $2.50
      below 200k tokens. Prefer over 4.5 when the job is mostly reading, not hard reasoning.
    contextWindow: 1_000_000
    pricing: { unit: per_1m_tokens, input: 1.25, output: 2.50, cached_input: 0.20 }
    categories: [text-to-text]
    parameters:
      - { id: parameter_temperature, required: false, defaultValue: 1, constraints: { min: 0, max: 2, step: 0.1 } }
      - { id: parameter_max_output_tokens, required: false, constraints: { min: 1, max: 128000 } }
      - { id: parameter_reasoning_effort, required: false, defaultValue: medium, allowedValues: [low, medium, high] }

  - id: xai/grok-4.20-0309-reasoning
    name: Grok 4.20 Reasoning
    provider: xai
    description: >
      Grok 4.20 with reasoning on. Same $1.25 / $2.50 list price as 4.3. Prefer
      for short analytical workers. OpenRouter currently exposes this as x-ai/grok-4.20.
      Prompts at or above 200k tokens double the request rate.
    contextWindow: 1_000_000
    pricing: { unit: per_1m_tokens, input: 1.25, output: 2.50, cached_input: 0.20 }
    categories: [text-to-text]
    parameters:
      - { id: parameter_temperature, required: false, defaultValue: 1, constraints: { min: 0, max: 2, step: 0.1 } }
      - { id: parameter_max_output_tokens, required: false, constraints: { min: 1, max: 128000 } }
      - { id: parameter_reasoning_effort, required: false, defaultValue: high, allowedValues: [low, medium, high] }

  - id: xai/grok-4.20-0309-non-reasoning
    name: Grok 4.20
    provider: xai
    description: >
      Grok 4.20 without a reasoning step. Use for fast rewrites and summaries at
      the same list price as the reasoning SKU. OpenRouter currently exposes one
      grok-4.20 endpoint; prefer the reasoning catalog id when the gateway cannot
      disable thinking.
    contextWindow: 1_000_000
    pricing: { unit: per_1m_tokens, input: 1.25, output: 2.50, cached_input: 0.20 }
    categories: [text-to-text]
    parameters:
      - { id: parameter_temperature, required: false, defaultValue: 1, constraints: { min: 0, max: 2, step: 0.1 } }
      - { id: parameter_max_output_tokens, required: false, constraints: { min: 1, max: 128000 } }
      - { id: parameter_reasoning_effort, required: false, defaultValue: none, allowedValues: [none] }

  - id: xai/grok-build-0.1
    name: Grok Build 0.1
    provider: xai
    description: >
      Cheapest xAI text model. 256k context. Prefer for code-oriented short tasks
      and cheap workers. Prompts at or above 200k tokens bill at $2 / $4 per 1M.
    contextWindow: 256_000
    pricing: { unit: per_1m_tokens, input: 1.00, output: 2.00, cached_input: 0.20 }
    categories: [text-to-text]
    parameters:
      - { id: parameter_temperature, required: false, defaultValue: 1, constraints: { min: 0, max: 2, step: 0.1 } }
      - { id: parameter_max_output_tokens, required: false, constraints: { min: 1, max: 64000 } }
      - { id: parameter_reasoning_effort, required: false, defaultValue: medium, allowedValues: [low, medium, high] }
