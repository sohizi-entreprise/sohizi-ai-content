  parameter_voice: { vendorParamName: voice }
  parameter_stability: { vendorParamName: stability }
  parameter_similarity: { vendorParamName: similarity_boost }
  parameter_style_instructions: { vendorParamName: style }
  parameter_character_orientation:
    vendorParamName: character_orientation
    optionMapping:
      option_character_orientation_image: { value: image, mappedValue: image }
      option_character_orientation_video: { value: video, mappedValue: video }
  parameter_keep_original_sound: { vendorParamName: keep_original_sound }
  parameter_sync_mode:
    vendorParamName: sync_mode
    optionMapping:
      option_sync_mode_bounce: { value: bounce, mappedValue: bounce }
      option_sync_mode_loop: { value: loop, mappedValue: loop }
      option_sync_mode_cut_off: { value: cut_off, mappedValue: cut_off }
