  parameter_target_megapixels: { vendorParamName: scale_factor }
  parameter_lyrics: { vendorParamName: lyrics }
  parameter_is_instrumental: { vendorParamName: is_instrumental }
  parameter_lyrics_optimizer: { vendorParamName: lyrics_optimizer }
  parameter_number_of_songs: { vendorParamName: number_of_songs }
  parameter_audio_format:
    vendorParamName: audio_format
    optionMapping:
      option_audio_format_mp3: { value: mp3, mappedValue: mp3 }
      option_audio_format_wav: { value: wav, mappedValue: wav }
      option_audio_format_flac: { value: flac, mappedValue: flac }
      option_audio_format_aac: { value: aac, mappedValue: aac }
