id: vendor_vercel_gateway
name: vercel-gateway
adapter: vercel-gateway
url: https://vercel.com/ai-gateway
kind: llm
rateLimit: { rpm: 60, burst: 60, maxConcurrency: 10 }
circuitConfig: { cooldownMs: 15000, probeTtlMs: 30000 }
models:
  - { id: openai/gpt-6-astra, apiName: openai/gpt-6-astra, priority: 200 }
  - { id: openai/gpt-5.6-sol, apiName: openai/gpt-5.6-sol, priority: 200 }
  - { id: openai/gpt-5.5, apiName: openai/gpt-5.5, priority: 200 }
  - { id: openai/gpt-5.4, apiName: openai/gpt-5.4, priority: 200 }
  - { id: openai/gpt-5.4-mini, apiName: openai/gpt-5.4-mini, priority: 200 }
  - { id: openai/gpt-5.4-nano, apiName: openai/gpt-5.4-nano, priority: 200 }
  - { id: openai/gpt-5-mini, apiName: openai/gpt-5-mini, priority: 200 }
  - { id: openai/gpt-4.1-mini, apiName: openai/gpt-4.1-mini, priority: 200 }
parametersMapping:
  parameter_temperature: { vendorParamName: temperature }
  parameter_max_output_tokens: { vendorParamName: max_tokens }
  parameter_reasoning_effort:
    vendorParamName: reasoning_effort
    optionMapping:
      option_reasoning_effort_none: { value: none, mappedValue: none }
      option_reasoning_effort_minimal: { value: minimal, mappedValue: minimal }
      option_reasoning_effort_low: { value: low, mappedValue: low }
      option_reasoning_effort_medium: { value: medium, mappedValue: medium }
      option_reasoning_effort_high: { value: high, mappedValue: high }
      option_reasoning_effort_xhigh: { value: xhigh, mappedValue: xhigh }
      option_reasoning_effort_max: { value: max, mappedValue: max }
