id: vendor_vercel_gateway
name: vercel-gateway
adapter: vercel-gateway
url: https://vercel.com/ai-gateway
kind: llm
rateLimit: { rpm: 60, burst: 60, maxConcurrency: 10 }
circuitConfig: { cooldownMs: 15000, probeTtlMs: 30000 }
# Same text models as OpenRouter. apiName is the live Vercel AI Gateway id
# (Anthropic uses dots; Grok is spacexai/*; Gemini 3 Flash has no -preview suffix).
# Priority 50 keeps Vercel AI Gateway ahead of OpenRouter (65–100).
models:
  - { id: openai/gpt-6-astra, apiName: openai/gpt-6-astra, priority: 50 }
  - { id: openai/gpt-6-sol, apiName: openai/gpt-6-sol, priority: 50 }
