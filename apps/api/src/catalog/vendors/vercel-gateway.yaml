parametersMapping:
  parameter_temperature: { vendorParamName: temperature }
  parameter_max_output_tokens: { vendorParamName: max_tokens }
  parameter_reasoning_effort:
    vendorParamName: reasoning_effort
    optionMapping:
      option_reasoning_effort_none: { value: none, mappedValue: none }
      option_reasoning_effort_minimal: { value: minimal, mappedValue: minimal }
      option_reasoning_effort_low: { value: low, mappedValue: low }
      option_reasoning_effort_medium: { value: medium, mappedValue: medium }
      option_reasoning_effort_high: { value: high, mappedValue: high }
      option_reasoning_effort_xhigh: { value: xhigh, mappedValue: xhigh }
      option_reasoning_effort_max: { value: max, mappedValue: max }
