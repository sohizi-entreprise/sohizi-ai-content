# App-defined parameter vocabulary. Models pick a subset via allowedValues / constraints.
# Vendor files map these ids onto provider field names.
types:
  - string
  - number
  - boolean
  - array<string>
  - array<number>
uiComponents:
  - select
  - slider
  - uploader
  - textarea
  - checkbox
parameters:
  - id: parameter_prompt
    key: prompt
    label: Prompt
    type: string
    description: Text instruction for generation or editing.
    xUiComponent: textarea

  - id: parameter_negative_prompt
    key: negative_prompt
    label: Negative prompt
    type: string
    description: Things the model should avoid in the output.
    xUiComponent: textarea

  - id: parameter_aspect_ratio
    key: aspect_ratio
    label: Aspect ratio
    type: string
    description: Output frame shape.
    xUiComponent: select
    options:
      - { id: option_aspect_ratio_auto, value: auto, label: Auto }
      - { id: option_aspect_ratio_1_1, value: "1:1", label: "1:1" }
      - { id: option_aspect_ratio_16_9, value: "16:9", label: "16:9" }
      - { id: option_aspect_ratio_9_16, value: "9:16", label: "9:16" }
      - { id: option_aspect_ratio_4_3, value: "4:3", label: "4:3" }
      - { id: option_aspect_ratio_3_4, value: "3:4", label: "3:4" }
      - { id: option_aspect_ratio_3_2, value: "3:2", label: "3:2" }
      - { id: option_aspect_ratio_2_3, value: "2:3", label: "2:3" }
      - { id: option_aspect_ratio_4_5, value: "4:5", label: "4:5" }
      - { id: option_aspect_ratio_5_4, value: "5:4", label: "5:4" }
      - { id: option_aspect_ratio_21_9, value: "21:9", label: "21:9" }
      - { id: option_aspect_ratio_9_21, value: "9:21", label: "9:21" }
      - { id: option_aspect_ratio_2_1, value: "2:1", label: "2:1" }
      - { id: option_aspect_ratio_1_2, value: "1:2", label: "1:2" }
      - { id: option_aspect_ratio_3_1, value: "3:1", label: "3:1" }
      - { id: option_aspect_ratio_1_3, value: "1:3", label: "1:3" }
      - { id: option_aspect_ratio_4_1, value: "4:1", label: "4:1" }
      - { id: option_aspect_ratio_1_4, value: "1:4", label: "1:4" }
      - { id: option_aspect_ratio_8_1, value: "8:1", label: "8:1" }
      - { id: option_aspect_ratio_1_8, value: "1:8", label: "1:8" }

  - id: parameter_resolution
    key: resolution
    label: Resolution
    type: string
    description: Output pixel density. Image models use k labels; video models use p labels.
    xUiComponent: select
    options:
      - { id: option_resolution_360p, value: 360p, label: 360p }
      - { id: option_resolution_480p, value: 480p, label: 480p }
      - { id: option_resolution_720p, value: 720p, label: 720p }
      - { id: option_resolution_1080p, value: 1080p, label: 1080p }
      - { id: option_resolution_0_5k, value: 0.5k, label: 0.5K }
      - { id: option_resolution_1k, value: 1k, label: 1K }
      - { id: option_resolution_2k, value: 2k, label: 2K }
      - { id: option_resolution_4k, value: 4k, label: 4K }

  - id: parameter_quality
    key: quality
    label: Quality
    type: string
    description: Rendering quality tier. Higher tiers add detail and cost more.
    xUiComponent: select
    options:
      - { id: option_quality_low, value: low, label: Low }
      - { id: option_quality_medium, value: medium, label: Medium }
      - { id: option_quality_high, value: high, label: High }
      - { id: option_quality_xhigh, value: xhigh, label: Extra high }
      - { id: option_quality_max, value: max, label: Max }

  - id: parameter_duration
    key: duration
    label: Duration
    type: number
    description: Output length in seconds.
    xUiComponent: slider

  - id: parameter_output_format
    key: output_format
    label: Output format
    type: string
    description: File format of the generated still image.
    xUiComponent: select
    options:
      - { id: option_output_format_png, value: png, label: PNG }
      - { id: option_output_format_jpeg, value: jpeg, label: JPEG }
      - { id: option_output_format_webp, value: webp, label: WebP }

  - id: parameter_generate_audio
    key: generate_audio
    label: Generate audio
    type: boolean
    description: Whether the video should include a generated soundtrack.
    xUiComponent: checkbox

  - id: parameter_background
    key: background
    label: Background
    type: string
    description: Background treatment for the generated image.
    xUiComponent: select
    options:
      - { id: option_background_auto, value: auto, label: Auto }
      - { id: option_background_opaque, value: opaque, label: Opaque }
      - {
          id: option_background_transparent,
          value: transparent,
          label: Transparent,
        }

  - id: parameter_image
    key: image
    label: Image
    type: string
    description: Single source or start-frame image URL.
    xUiComponent: uploader
    fileType: image

  - id: parameter_images
    key: images
    label: Images
    type: array<string>
    description: One or more reference or source image URLs.
    xUiComponent: uploader
    fileType: image

  - id: parameter_last_image
    key: last_image
    label: Last frame
    type: string
    description: Optional end-frame image. The model interpolates from the start image to this frame.
    xUiComponent: uploader
    fileType: image

  - id: parameter_video
    key: video
    label: Video
    type: string
    description: Source video URL to edit or restyle.
    xUiComponent: uploader
    fileType: video

  - id: parameter_reference_images
    key: reference_images
    label: Reference images
    type: array<string>
    description: Optional images that lock style, characters, or scene composition.
    xUiComponent: uploader
    fileType: image

  - id: parameter_reference_videos
    key: reference_videos
    label: Reference videos
    type: array<string>
    description: Optional video clips that guide motion or identity.
    xUiComponent: uploader
    fileType: video

  - id: parameter_reference_audios
    key: reference_audios
    label: Reference audio
    type: array<string>
    description: Optional audio clips that guide voice, music, or sound design.
    xUiComponent: uploader
    fileType: audio

  - id: parameter_audio
    key: audio
    label: Audio
    type: string
    description: Source audio URL for speech, voice restyle, lip sync, or a cover reference.
    xUiComponent: uploader
    fileType: audio

