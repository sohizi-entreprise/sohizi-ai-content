  - id: parameter_stability
    key: stability
    label: Stability
    type: number
    description: How consistent speech delivery stays. Lower allows more variation.
    xUiComponent: slider

  - id: parameter_similarity
    key: similarity
    label: Similarity
    type: number
    description: How closely generated speech follows the selected voice.
    xUiComponent: slider

  - id: parameter_style_instructions
    key: style_instructions
    label: Style instructions
    type: string
    description: Delivery style, tone, pacing, or accent for speech.
    xUiComponent: textarea

  - id: parameter_character_orientation
    key: character_orientation
    label: Character orientation
    type: string
    description: Whether the output character matches the image or the driving video.
    xUiComponent: select
    options:
      - { id: option_character_orientation_image, value: image, label: Image }
      - { id: option_character_orientation_video, value: video, label: Video }

  - id: parameter_keep_original_sound
    key: keep_original_sound
    label: Keep original sound
    type: boolean
    description: Whether the output keeps the driving video soundtrack.
    xUiComponent: checkbox

  - id: parameter_sync_mode
    key: sync_mode
    label: Sync mode
    type: string
    description: How to handle a duration mismatch between video and audio.
    xUiComponent: select
    options:
      - { id: option_sync_mode_bounce, value: bounce, label: Bounce }
      - { id: option_sync_mode_loop, value: loop, label: Loop }
      - { id: option_sync_mode_cut_off, value: cut_off, label: Cut off }
      - { id: option_sync_mode_silence, value: silence, label: Silence }
      - { id: option_sync_mode_remap, value: remap, label: Remap }

  - id: parameter_creativity
    key: creativity
    label: Creativity
    type: number
    description: How freely the upscaler invents detail. Negative stays closer to the source.
    xUiComponent: slider

  - id: parameter_target_megapixels
    key: target_megapixels
    label: Target megapixels
    type: number
    description: Requested output size in megapixels.
    xUiComponent: slider

  - id: parameter_lyrics
    key: lyrics
    label: Lyrics
    type: string
    description: Sung lyrics for a generated song.
    xUiComponent: textarea

  - id: parameter_is_instrumental
    key: is_instrumental
    label: Instrumental
    type: boolean
    description: Generate music without vocals.
    xUiComponent: checkbox

  - id: parameter_lyrics_optimizer
    key: lyrics_optimizer
    label: Lyrics optimizer
    type: boolean
    description: Auto-generate lyrics from the prompt when lyrics are empty.
    xUiComponent: checkbox

  - id: parameter_number_of_songs
    key: number_of_songs
    label: Number of songs
    type: number
    description: How many tracks to generate in one request.
    xUiComponent: slider

  - id: parameter_audio_format
    key: audio_format
    label: Audio format
    type: string
    description: File format of the generated audio.
    xUiComponent: select
    options:
      - { id: option_audio_format_mp3, value: mp3, label: MP3 }
      - { id: option_audio_format_wav, value: wav, label: WAV }
      - { id: option_audio_format_flac, value: flac, label: FLAC }
      - { id: option_audio_format_aac, value: aac, label: AAC }

  - id: parameter_temperature
    key: temperature
    label: Temperature
    type: number
    description: Sampling randomness for text generation. Lower is more deterministic.
    xUiComponent: slider

  - id: parameter_max_output_tokens
    key: max_output_tokens
    label: Max output tokens
    type: number
    description: Upper bound on generated text tokens.
    xUiComponent: slider

  - id: parameter_reasoning_effort
    key: reasoning_effort
    label: Reasoning effort
    type: string
    description: How much internal reasoning the model should spend before answering.
    xUiComponent: select
    options:
      - { id: option_reasoning_effort_none, value: none, label: None }
      - { id: option_reasoning_effort_minimal, value: minimal, label: Minimal }
      - { id: option_reasoning_effort_low, value: low, label: Low }
      - { id: option_reasoning_effort_medium, value: medium, label: Medium }
      - { id: option_reasoning_effort_high, value: high, label: High }
      - { id: option_reasoning_effort_xhigh, value: xhigh, label: Extra high }
      - { id: option_reasoning_effort_max, value: max, label: Max }
