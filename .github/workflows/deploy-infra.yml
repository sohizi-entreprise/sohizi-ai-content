name: Deploy Infra Service

on:
  workflow_dispatch:
    inputs:
      component:
        description: "Infra component to deploy to ~/infra/<component>"
        required: true
        type: choice
        options:
          - caddy
          - cloudflare-tunnel
          - arcane-beszel

concurrency:
  group: deploy-infra-${{ inputs.component }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-infra:
    name: Deploy Infra (${{ inputs.component }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout infra configs
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            infra
          sparse-checkout-cone-mode: false

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add VPS to known hosts
        run: ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Stage and deploy ${{ inputs.component }}
        env:
          COMPONENT: ${{ inputs.component }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          ENV_FILE_COMMON: ${{ vars.ENV_FILE_COMMON }}
        run: |
          set -euo pipefail

          STAGE_DIR="/tmp/infra-${COMPONENT}"
          mkdir -p "$STAGE_DIR"

          if [ -n "$ENV_FILE_COMMON" ]; then
            printf '%s\n' "$ENV_FILE_COMMON" | tr -d '\r' > "$STAGE_DIR/.env"
            set -a
            . "$STAGE_DIR/.env"
            set +a
          fi

          case "$COMPONENT" in
            caddy)
              cp infra/caddy-compose.yaml "$STAGE_DIR/compose.yaml"
              rm -f "$STAGE_DIR/.env"
              ;;

            cloudflare-tunnel)
              cp infra/cloudfare-tunnel.yaml "$STAGE_DIR/compose.yaml"
              if [ -z "${CLOUDFLARE_TUNNEL_TOKEN:-}" ]; then
                echo "::error::Missing CLOUDFLARE_TUNNEL_TOKEN in ENV_FILE_COMMON"
                exit 1
              fi
              printf 'CLOUDFLARE_TUNNEL_TOKEN=%s\n' "$CLOUDFLARE_TUNNEL_TOKEN" > "$STAGE_DIR/.env"
              ;;

            arcane-beszel)
              cp infra/arcane-beszel.yaml "$STAGE_DIR/compose.yaml"
              if [ -z "${ARCANE_ENCRYPTION_KEY:-}" ]; then
                echo "::error::Missing ARCANE_ENCRYPTION_KEY in ENV_FILE_COMMON"
                exit 1
              fi
              {
                printf 'INFRA_DOMAIN=%s\n' "${INFRA_DOMAIN:-sohizi.net}"
                printf 'ARCANE_ENCRYPTION_KEY=%s\n' "$ARCANE_ENCRYPTION_KEY"
                printf 'BESZEL_TOKEN=%s\n' "${BESZEL_TOKEN:-}"
                printf 'BESZEL_PUBLIC_KEY=%s\n' "${BESZEL_PUBLIC_KEY:-}"
                [ -n "${STACKS_DIR:-}" ] && printf 'STACKS_DIR=%s\n' "$STACKS_DIR"
                true
              } > "$STAGE_DIR/.env"
              ;;

            *)
              echo "::error::Unknown component: $COMPONENT"
              exit 1
              ;;
          esac

          remote="${SSH_USER}@${SSH_HOST}"
          remote_dir="~/infra/${COMPONENT}"

          ssh "$remote" "mkdir -p ${remote_dir}"
          scp "$STAGE_DIR/compose.yaml" "${remote}:${remote_dir}/compose.yaml"

          if [ -f "$STAGE_DIR/.env" ]; then
            chmod 600 "$STAGE_DIR/.env"
            scp "$STAGE_DIR/.env" "${remote}:${remote_dir}/.env"
          fi

          ssh "$remote" "set -euo pipefail
            cd ${remote_dir}
            [ -f .env ] && chmod 600 .env
            docker network inspect caddy >/dev/null 2>&1 || docker network create caddy
            docker compose -p ${COMPONENT} -f compose.yaml pull
            docker compose -p ${COMPONENT} -f compose.yaml up -d --remove-orphans
          "
