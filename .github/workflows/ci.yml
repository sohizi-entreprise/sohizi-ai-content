name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, web, site]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format
        run: bun run --filter @sohizi/${{ matrix.app }} format:check

      - name: Lint
        run: bun run --filter @sohizi/${{ matrix.app }} lint

      - name: Test
        if: matrix.app == 'web'
        run: bun run --filter @sohizi/web test

      - name: Test
        if: matrix.app == 'api'
        run: bun run --filter @sohizi/api test:ci
        env:
          REDIS_URL: redis://127.0.0.1:6379

  docker:
    name: Docker ${{ matrix.app }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, web, site]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/sohizi-lab
          tags: |
            type=raw,value=${{ matrix.app }}-${{ github.sha }}
            type=raw,value=${{ matrix.app }}-latest,enable=${{ github.event_name == 'push' }}

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy-files:
    name: Deploy files
    needs: docker
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add VPS to known hosts
        run: ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Stage and copy files
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          mkdir -p /tmp/sohizi-deploy
          cp compose.prod.yaml /tmp/sohizi-deploy/compose.yml
          cp docker/postgres/init.sql /tmp/sohizi-deploy/init.sql
          printf '%s\n' "$ENV_FILE" > /tmp/sohizi-deploy/.env
          remote="${SSH_USER}@${SSH_HOST}"
          ssh "$remote" 'mkdir -p ~/sohizi-lab'
          scp /tmp/sohizi-deploy/compose.yml /tmp/sohizi-deploy/init.sql /tmp/sohizi-deploy/.env "$remote:~/sohizi-lab/"
          ssh "$remote" 'cd ~/sohizi-lab && ls -la && test -s compose.yml && test -s init.sql && test -s .env && wc -l compose.yml init.sql .env'
