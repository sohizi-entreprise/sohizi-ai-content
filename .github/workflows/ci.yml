name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.matrix.outputs.api }}
      deploy: ${{ steps.matrix.outputs.deploy }}
      frontend_apps: ${{ steps.matrix.outputs.frontend_apps }}
      has_frontend: ${{ steps.matrix.outputs.has_frontend }}
      docker_apps: ${{ steps.matrix.outputs.docker_apps }}
      has_docker: ${{ steps.matrix.outputs.has_docker }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/analytics/**'
              - 'packages/eslint-config/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - 'packages/ui/**'
              - 'packages/analytics/**'
              - 'packages/video-composition/**'
              - 'packages/eslint-config/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/ci.yml'
            site:
              - 'apps/site/**'
              - 'packages/ui/**'
              - 'packages/analytics/**'
              - 'packages/eslint-config/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/ci.yml'
            deploy:
              - 'compose.prod.yaml'

      - name: Build job matrices
        id: matrix
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            API="true"
            WEB="true"
            SITE="true"
            DEPLOY="true"
          else
            API="${{ steps.filter.outputs.api }}"
            WEB="${{ steps.filter.outputs.web }}"
            SITE="${{ steps.filter.outputs.site }}"
            DEPLOY="${{ steps.filter.outputs.deploy }}"
          fi

          FRONTEND_APPS=$(jq -cn \
            --arg web "$WEB" \
            --arg site "$SITE" \
            '[
              (if $web == "true" then "web" else empty end),
              (if $site == "true" then "site" else empty end)
            ]')
          DOCKER_APPS=$(jq -cn \
            --arg api "$API" \
            --arg web "$WEB" \
            --arg site "$SITE" \
            '[
              (if $api == "true" then "api" else empty end),
              (if $web == "true" then "web" else empty end),
              (if $site == "true" then "site" else empty end)
            ]')
          echo "api=$API" >> "$GITHUB_OUTPUT"
          echo "deploy=$DEPLOY" >> "$GITHUB_OUTPUT"
          echo "frontend_apps=$FRONTEND_APPS" >> "$GITHUB_OUTPUT"
          echo "has_frontend=$([ "$FRONTEND_APPS" != "[]" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "docker_apps=$DOCKER_APPS" >> "$GITHUB_OUTPUT"
          echo "has_docker=$([ "$DOCKER_APPS" != "[]" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  check-api:
    name: Check api
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format
        run: bun run --filter @sohizi/api format:check

      - name: Lint
        run: bun run --filter @sohizi/api lint

      - name: Test
        run: bun run --filter @sohizi/api test:ci
        env:
          REDIS_URL: redis://127.0.0.1:6379

  check-frontend:
    name: Check ${{ matrix.app }}
    needs: changes
    if: needs.changes.outputs.has_frontend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.changes.outputs.frontend_apps) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format
        run: bun run --filter @sohizi/${{ matrix.app }} format:check

      - name: Lint
        run: bun run --filter @sohizi/${{ matrix.app }} lint

      - name: Test
        if: matrix.app == 'web'
        run: bun run --filter @sohizi/web test

  docker:
    name: Docker ${{ matrix.app }}
    needs: [changes, check-api, check-frontend]
    if: |
      !failure() && !cancelled() &&
      needs.changes.outputs.has_docker == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.changes.outputs.docker_apps) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sohizi-${{ matrix.app }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=rc,enable=${{ github.event_name != 'pull_request' }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          build-args: |
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT_WEB=${{ vars.SENTRY_PROJECT_WEB }}
            SENTRY_PROJECT_SITE=${{ vars.SENTRY_PROJECT_SITE }}
            SENTRY_RELEASE=${{ github.sha }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy-rc:
    name: Deploy RC
    needs: [changes, docker]
    if: |
      !failure() && !cancelled() &&
      github.event_name != 'pull_request' &&
      (needs.changes.outputs.has_docker == 'true' || needs.changes.outputs.deploy == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add VPS to known hosts
        run: ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Stage, migrate, and roll out RC
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          ENV_FILE_COMMON: ${{ vars.ENV_FILE_COMMON }}
          ENV_FILE: ${{ vars.ENV_FILE_RC }}
          GHCR_OWNER: ${{ github.repository_owner }}
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER_LOWER=$(echo "$GHCR_OWNER" | tr '[:upper:]' '[:lower:]')
          mkdir -p /tmp/sohizi-deploy-rc
          cp compose.prod.yaml /tmp/sohizi-deploy-rc/compose.yml

          : > /tmp/sohizi-deploy-rc/.env
          if [ -n "$ENV_FILE_COMMON" ]; then
            printf '%s\n\n' "$ENV_FILE_COMMON" >> /tmp/sohizi-deploy-rc/.env
          fi
          printf '%s\n' "$ENV_FILE" >> /tmp/sohizi-deploy-rc/.env
          cat <<EOF >> /tmp/sohizi-deploy-rc/.env

          APP_ENV=rc
          API_STOP_GRACE_PERIOD=10s
          GHCR_OWNER=${OWNER_LOWER}
          IMAGE_TAG=rc
          POSTGRES_DB=sohizi_rc
          REDIS_DB_INDEX=0
          SENTRY_RELEASE=${{ github.sha }}
          SENTRY_ENVIRONMENT=rc
          EOF

          remote="${SSH_USER}@${SSH_HOST}"
          ssh "$remote" 'mkdir -p ~/sohizi-rc'
          scp /tmp/sohizi-deploy-rc/compose.yml /tmp/sohizi-deploy-rc/.env "$remote:~/sohizi-rc/"

          printf '%s\n' "$GHCR_TOKEN" | ssh "$remote" 'set -euo pipefail
            cd ~/sohizi-rc
            docker login ghcr.io -u "'"$GHCR_ACTOR"'" --password-stdin
            docker compose -p sohizi-rc -f compose.yml --profile migrate pull api web site migrate
            docker compose -p sohizi-rc -f compose.yml --profile migrate run --rm migrate
            docker compose -p sohizi-rc -f compose.yml up -d --remove-orphans api web site
          '
