name: Deploy Stateful Services

on:
  workflow_dispatch:

concurrency:
  group: deploy-stateful
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-stateful:
    name: Deploy Shared Stateful Stack (Postgres, Redis, Inngest, pgAdmin, Maintenance)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add VPS to known hosts
        run: ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Stage and roll out stateful services
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          ENV_FILE_COMMON: ${{ vars.ENV_FILE_COMMON }}
          ENV_FILE_RC: ${{ vars.ENV_FILE_RC }}
          ENV_FILE_PROD: ${{ vars.ENV_FILE_PROD }}
          INFRA_DOMAIN: ${{ vars.INFRA_DOMAIN }}
          PGADMIN_DEFAULT_EMAIL: ${{ vars.PGADMIN_DEFAULT_EMAIL }}
          PGADMIN_DEFAULT_PASSWORD: ${{ secrets.PGADMIN_DEFAULT_PASSWORD }}
        run: |
          mkdir -p /tmp/sohizi-stateful
          cp compose.stateful.yaml /tmp/sohizi-stateful/compose.stateful.yaml
          cp docker/postgres/init.sql /tmp/sohizi-stateful/init.sql
          cp docker/postgres/maintenance.sh /tmp/sohizi-stateful/maintenance.sh
          chmod +x /tmp/sohizi-stateful/maintenance.sh

          # Merge common stateful config and per-env overrides (ignoring empty placeholders)
          : > /tmp/sohizi-stateful/.env
          for block in "$ENV_FILE_COMMON" "$ENV_FILE_RC" "$ENV_FILE_PROD"; do
            if [ -n "$block" ]; then
              printf '\n' >> /tmp/sohizi-stateful/.env
              printf '%s\n' "$block" | tr -d '\r' | grep -E '^[A-Za-z_][A-Za-z0-9_]*=.+$' >> /tmp/sohizi-stateful/.env || true
            fi
          done

          # Append explicit GitHub variables for INFRA_DOMAIN, default POSTGRES_DB, and pgAdmin
          {
            printf 'POSTGRES_DB=postgres\n'
            [ -n "$INFRA_DOMAIN" ] && printf 'INFRA_DOMAIN=%s\n' "$INFRA_DOMAIN"
            [ -n "$PGADMIN_DEFAULT_EMAIL" ] && printf 'PGADMIN_DEFAULT_EMAIL=%s\n' "$PGADMIN_DEFAULT_EMAIL"
            [ -n "$PGADMIN_DEFAULT_PASSWORD" ] && printf 'PGADMIN_DEFAULT_PASSWORD=%s\n' "$PGADMIN_DEFAULT_PASSWORD"
            true
          } >> /tmp/sohizi-stateful/.env

          # Generate pgAdmin servers.json with the configured POSTGRES_USER
          set -a
          . /tmp/sohizi-stateful/.env
          set +a
          jq --arg user "${POSTGRES_USER:-postgres}" \
            '.Servers["1"].Username = $user' \
            docker/postgres/servers.json > /tmp/sohizi-stateful/servers.json

          remote="${SSH_USER}@${SSH_HOST}"
          ssh "$remote" 'mkdir -p ~/sohizi-stateful'
          scp \
            /tmp/sohizi-stateful/compose.stateful.yaml \
            /tmp/sohizi-stateful/init.sql \
            /tmp/sohizi-stateful/maintenance.sh \
            /tmp/sohizi-stateful/servers.json \
            /tmp/sohizi-stateful/.env \
            "$remote:~/sohizi-stateful/"

          ssh "$remote" 'set -euo pipefail
            cd ~/sohizi-stateful
            chmod +x ./maintenance.sh
            docker network inspect caddy >/dev/null 2>&1 || docker network create caddy
            docker compose -p sohizi-stateful -f compose.stateful.yaml up -d postgres redis --wait

            # Idempotently ensure dedicated RC and Prod databases exist even on pre-existing volumes
            set -a
            . ./.env
            set +a
            for db in sohizi_rc sohizi_prod inngest_rc inngest_prod; do
              docker compose -p sohizi-stateful -f compose.stateful.yaml exec -T postgres \
                psql -U "${POSTGRES_USER}" -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = '\''${db}'\''" | grep -q 1 || \
              docker compose -p sohizi-stateful -f compose.stateful.yaml exec -T postgres \
                psql -U "${POSTGRES_USER}" -d postgres -c "CREATE DATABASE ${db};"
            done
            for db in sohizi_rc sohizi_prod; do
              docker compose -p sohizi-stateful -f compose.stateful.yaml exec -T postgres \
                psql -U "${POSTGRES_USER}" -d "${db}" -c "CREATE EXTENSION IF NOT EXISTS pg_stat_statements;"
            done

            docker compose -p sohizi-stateful -f compose.stateful.yaml up -d --remove-orphans
          '
