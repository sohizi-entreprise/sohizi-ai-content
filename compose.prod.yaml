name: sohizi

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    image: ghcr.io/${GHCR_OWNER}/sohizi-api:${IMAGE_TAG:-rc}
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: ${API_STOP_GRACE_PERIOD:-600s}
    environment:
      NODE_ENV: production
      SENTRY_DSN: ${API_SENTRY_DSN}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-rc}
      SENTRY_LOCAL_ENABLED: ${SENTRY_LOCAL_ENABLED:-false}
      SENTRY_RELEASE: ${SENTRY_RELEASE}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/${REDIS_DB_INDEX:-0}
      INNGEST_DEV: "0"
      INNGEST_BASE_URL: http://${APP_ENV:-rc}-inngest:8288
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY}
      OPENAI_API_KEY: ${API_OPENAI_API_KEY}
      R2_ACCESS_KEY_ID: ${API_R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${API_R2_SECRET_ACCESS_KEY}
      R2_ENDPOINT: ${API_R2_ENDPOINT}
      R2_BUCKET_NAME: ${API_R2_BUCKET_NAME}
      R2_PUBLIC_URL: ${API_R2_PUBLIC_URL}
      BETTER_AUTH_SECRET: ${API_BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${API_BETTER_AUTH_URL}
      POLAR_ACCESS_TOKEN: ${API_POLAR_ACCESS_TOKEN}
      POLAR_WEBHOOK_SECRET: ${API_POLAR_WEBHOOK_SECRET}
      POLAR_ENVIRONMENT: ${API_POLAR_ENVIRONMENT:-production}
      GOOGLE_CLIENT_ID: ${API_GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${API_GOOGLE_CLIENT_SECRET}
      RESEND_API_KEY: ${API_RESEND_API_KEY}
      EMAIL_FROM: ${API_EMAIL_FROM}
      FRONTEND_URL: ${API_FRONTEND_URL}
      POSTHOG_PROJECT: ${POSTHOG_PROJECT}
      POSTHOG_API_HOST: ${POSTHOG_API_HOST}
      POSTHOG_API_VERSION: ${POSTHOG_API_VERSION}
      CLOUDFLARE_WORKER_URL: ${API_CLOUDFLARE_WORKER_URL}
      CLOUDFLARE_WORKER_TOKEN: ${API_CLOUDFLARE_WORKER_TOKEN}
      YOUTUBE_SCREENSHOT_MAX_TABS: ${API_YOUTUBE_SCREENSHOT_MAX_TABS:-10}
      RENDER_SERVICE_TOKEN: ${API_RENDER_SERVICE_TOKEN}
      RENDER_ALLOWED_MEDIA_HOSTS: ${API_RENDER_ALLOWED_MEDIA_HOSTS}
      REMOTION_AWS_ACCESS_KEY_ID: ${API_REMOTION_AWS_ACCESS_KEY_ID}
      REMOTION_AWS_SECRET_ACCESS_KEY: ${API_REMOTION_AWS_SECRET_ACCESS_KEY}
      REMOTION_AWS_REGION: ${API_REMOTION_AWS_REGION:-us-east-1}
      REMOTION_FUNCTION_NAME: ${API_REMOTION_FUNCTION_NAME}
      REMOTION_SERVE_URL: ${API_REMOTION_SERVE_URL}
      REMOTION_CONCURRENCY: ${API_REMOTION_CONCURRENCY:-100}
      LANGFUSE_PUBLIC_KEY: ${API_LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${API_LANGFUSE_SECRET_KEY}
      LANGFUSE_BASE_URL: ${API_LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      LANGFUSE_TRACING_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-rc}
      LUMEN_API_KEY: ${API_LUMEN_API_KEY}
      OPENROUTER_API_KEY: ${API_OPENROUTER_API_KEY}
      VERCEL_GATEWAY_API_KEY: ${API_VERCEL_GATEWAY_API_KEY}
      TRAVELY_API_KEY: ${API_TRAVELY_API_KEY}
      WAVESPEED_API_KEY: ${API_WAVESPEED_API_KEY}
      REPLICATE_API_TOKEN: ${API_REPLICATE_API_TOKEN}
    healthcheck:
      test: ["CMD", "/app/api", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    logging: *default-logging
    networks:
      caddy:
        aliases:
          - ${APP_ENV:-rc}-api
    labels:
      caddy: ${CADDY_SITE_PREFIX-http://}api.${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 3030}}"
      caddy.reverse_proxy.lb_try_duration: 5s

  web:
    image: ghcr.io/${GHCR_OWNER}/sohizi-web:${IMAGE_TAG:-rc}
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      SENTRY_DSN: ${WEB_SENTRY_DSN}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-rc}
      SENTRY_LOCAL_ENABLED: ${SENTRY_LOCAL_ENABLED:-false}
      SENTRY_RELEASE: ${SENTRY_RELEASE}
      HOST: 0.0.0.0
      PORT: "3000"
      SITE_URL: ${WEB_SITE_URL}
      MEDIA_CDN_URL: ${WEB_MEDIA_CDN_URL}
      API_URL: ${WEB_API_URL}
      POSTHOG_PROJECT: ${POSTHOG_PROJECT}
      POSTHOG_API_HOST: ${POSTHOG_API_HOST}
      POSTHOG_API_VERSION: ${POSTHOG_API_VERSION}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    logging: *default-logging
    networks:
      - caddy
    labels:
      caddy: ${CADDY_SITE_PREFIX-http://}app.${DOMAIN}
      caddy.0_handle: /api/auth*
      caddy.0_handle.0_reverse_proxy: ${APP_ENV:-rc}-api:3030
      caddy.0_handle.0_reverse_proxy.lb_try_duration: 5s
      caddy.1_handle_path: /api/*
      caddy.1_handle_path.0_reverse_proxy: ${APP_ENV:-rc}-api:3030
      caddy.1_handle_path.0_reverse_proxy.lb_try_duration: 5s
      caddy.2_handle:
      caddy.2_handle.0_reverse_proxy: "{{upstreams 3000}}"
      caddy.2_handle.0_reverse_proxy.lb_try_duration: 5s

  site:
    image: ghcr.io/${GHCR_OWNER}/sohizi-site:${IMAGE_TAG:-rc}
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      SENTRY_DSN: ${SITE_SENTRY_DSN}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-rc}
      SENTRY_LOCAL_ENABLED: ${SENTRY_LOCAL_ENABLED:-false}
      SENTRY_RELEASE: ${SENTRY_RELEASE}
      HOST: 0.0.0.0
      PORT: "3001"
      APP_URL: ${SITE_APP_URL}
      POSTHOG_PROJECT: ${POSTHOG_PROJECT}
      POSTHOG_API_HOST: ${POSTHOG_API_HOST}
      POSTHOG_API_VERSION: ${POSTHOG_API_VERSION}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3001').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    logging: *default-logging
    networks:
      - caddy
    labels:
      caddy: ${CADDY_SITE_PREFIX-http://}www.${DOMAIN}
      caddy.0_handle_path: /api/*
      caddy.0_handle_path.0_reverse_proxy: ${APP_ENV:-rc}-api:3030
      caddy.0_handle_path.0_reverse_proxy.lb_try_duration: 5s
      caddy.1_handle:
      caddy.1_handle.0_reverse_proxy: "{{upstreams 3001}}"
      caddy.1_handle.0_reverse_proxy.lb_try_duration: 5s

  migrate:
    image: ghcr.io/${GHCR_OWNER}/sohizi-api:${IMAGE_TAG:-rc}
    pull_policy: always
    command: ["./migrate"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MIGRATIONS_FOLDER: /app/migrations
    networks:
      - caddy
    restart: "no"
    profiles: ["migrate"]
    logging: *default-logging

networks:
  caddy:
    external: true
