name: sohizi

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    image: sohizi/sohizi-lab:api-latest
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SENTRY_DSN: ${API_SENTRY_DSN}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-rc}
      SENTRY_LOCAL_ENABLED: ${SENTRY_LOCAL_ENABLED:-false}
      SENTRY_RELEASE: ${SENTRY_RELEASE}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      INNGEST_DEV: "0"
      INNGEST_BASE_URL: http://inngest:8288
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY}
      OPENAI_API_KEY: ${API_OPENAI_API_KEY}
      R2_ACCESS_KEY_ID: ${API_R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${API_R2_SECRET_ACCESS_KEY}
      R2_ENDPOINT: ${API_R2_ENDPOINT}
      R2_BUCKET_NAME: ${API_R2_BUCKET_NAME}
      R2_PUBLIC_URL: ${API_R2_PUBLIC_URL}
      BETTER_AUTH_SECRET: ${API_BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${API_BETTER_AUTH_URL}
      POLAR_ACCESS_TOKEN: ${API_POLAR_ACCESS_TOKEN}
      POLAR_WEBHOOK_SECRET: ${API_POLAR_WEBHOOK_SECRET}
      POLAR_ENVIRONMENT: ${API_POLAR_ENVIRONMENT:-production}
      GOOGLE_CLIENT_ID: ${API_GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${API_GOOGLE_CLIENT_SECRET}
      RESEND_API_KEY: ${API_RESEND_API_KEY}
      EMAIL_FROM: ${API_EMAIL_FROM}
      FRONTEND_URL: ${API_FRONTEND_URL}
      POSTHOG_PROJECT: ${POSTHOG_PROJECT}
      POSTHOG_API_HOST: ${POSTHOG_API_HOST}
      POSTHOG_API_VERSION: ${POSTHOG_API_VERSION}
      CLOUDFLARE_WORKER_URL: ${API_CLOUDFLARE_WORKER_URL}
      YOUTUBE_SCREENSHOT_TOKEN: ${API_YOUTUBE_SCREENSHOT_TOKEN}
      YOUTUBE_SCREENSHOT_WORKER_URL: ${API_YOUTUBE_SCREENSHOT_WORKER_URL}
      YOUTUBE_SCREENSHOT_MAX_TABS: ${API_YOUTUBE_SCREENSHOT_MAX_TABS:-10}
      RENDER_SERVICE_TOKEN: ${API_RENDER_SERVICE_TOKEN}
      RENDER_ALLOWED_MEDIA_HOSTS: ${API_RENDER_ALLOWED_MEDIA_HOSTS}
      LUMEN_API_KEY: ${API_LUMEN_API_KEY}
      OPENROUTER_API_KEY: ${API_OPENROUTER_API_KEY}
      VERCEL_GATEWAY_API_KEY: ${API_VERCEL_GATEWAY_API_KEY}
      TRAVELY_API_KEY: ${API_TRAVELY_API_KEY}
      WAVESPEED_API_KEY: ${API_WAVESPEED_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging
    networks:
      - caddy
      - private
    labels:
      caddy: http://api.${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 3030}}"

  web:
    image: sohizi/sohizi-lab:web-latest
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SENTRY_DSN: ${WEB_SENTRY_DSN}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-rc}
      SENTRY_LOCAL_ENABLED: ${SENTRY_LOCAL_ENABLED:-false}
      SENTRY_RELEASE: ${SENTRY_RELEASE}
      HOST: 0.0.0.0
      PORT: "3000"
      SITE_URL: ${WEB_SITE_URL}
      MEDIA_CDN_URL: ${WEB_MEDIA_CDN_URL}
      API_URL: ${WEB_API_URL}
      POSTHOG_PROJECT: ${POSTHOG_PROJECT}
      POSTHOG_API_HOST: ${POSTHOG_API_HOST}
      POSTHOG_API_VERSION: ${POSTHOG_API_VERSION}
    depends_on:
      api:
        condition: service_started
    logging: *default-logging
    networks:
      - caddy
    labels:
      caddy: http://app.${DOMAIN}
      caddy.0_handle: /api/auth*
      caddy.0_handle.0_reverse_proxy: api:3030
      caddy.1_handle_path: /api/*
      caddy.1_handle_path.0_reverse_proxy: api:3030
      caddy.2_handle:
      caddy.2_handle.0_reverse_proxy: "{{upstreams 3000}}"

  site:
    image: sohizi/sohizi-lab:site-latest
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SENTRY_DSN: ${SITE_SENTRY_DSN}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-rc}
      SENTRY_LOCAL_ENABLED: ${SENTRY_LOCAL_ENABLED:-false}
      SENTRY_RELEASE: ${SENTRY_RELEASE}
      HOST: 0.0.0.0
      PORT: "3001"
      APP_URL: ${SITE_APP_URL}
      POSTHOG_PROJECT: ${POSTHOG_PROJECT}
      POSTHOG_API_HOST: ${POSTHOG_API_HOST}
      POSTHOG_API_VERSION: ${POSTHOG_API_VERSION}
    logging: *default-logging
    networks:
      - caddy
    labels:
      caddy: http://www.${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 3001}}"

  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging
    networks:
      - private

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging
    networks:
      - private

  inngest:
    image: inngest/inngest:v1.41.1
    restart: unless-stopped
    command:
      - inngest
      - start
      - --host
      - 0.0.0.0
      - --sdk-url
      - http://api:3030/api/inngest
      - --poll-interval
      - "60"
      - --json
    environment:
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY}
      INNGEST_POSTGRES_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/inngest
      INNGEST_REDIS_URI: redis://redis:6379
      INNGEST_QUEUE_WORKERS: ${INNGEST_QUEUE_WORKERS:-20}
      LOG_LEVEL: ${INNGEST_LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "inngest", "alpha", "doctor", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging: *default-logging
    networks:
      - private
      - caddy
    labels:
      caddy: http://inngest.${DOMAIN}
      caddy.reverse_proxy: "{{upstreams 8288}}"

  migrate:
    image: sohizi/sohizi-lab:api-latest
    pull_policy: always
    command: ["./migrate"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MIGRATIONS_FOLDER: /app/migrations
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private
    restart: "no"
    profiles: ["migrate"]
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:

networks:
  caddy:
    external: true
  private:
